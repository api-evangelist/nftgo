aid: nftgo
name: NFTgo
description: >-
  NFTgo is an NFT data, analytics, and trading-aggregator platform that lets
  developers query NFT market data and execute transactions through a single
  REST API. The NFTgo Developer API spans several products: NFT Data (collection,
  token, owner, holder, rarity, and trait data across multiple chains), Charts &
  Market analytics (rankings, volume, market-cap, floor-price and holder charts),
  GoTrading (an aggregated order book plus create/fulfill/cancel listings and
  offers across OpenSea, Blur, LooksRare and X2Y2), GoPricing (machine-learning
  NFT valuations), and Notify (webhook-based real-time notifications). Requests
  authenticate with an X-API-KEY header against data-api.nftgo.io and are metered
  in Compute Units. NFTgo serves 3,000+ institutional customers and is backed by
  500 Global.
